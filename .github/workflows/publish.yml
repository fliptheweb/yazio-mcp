name: Publish to NPM and MCP Registry

# Publishing a GitHub Release publishes the package. Its tag (vX.Y.Z or vX.Y.Z-beta.N) is the version.
# A pre-release goes to the npm `beta` dist-tag and skips the MCP Registry.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm ci

      - name: Set version from the release tag
        run: |
          VERSION="${TAG#v}"
          if [ "$PRERELEASE" = "true" ] && [[ "$VERSION" != *-* ]]; then
            echo "::error::A pre-release needs a pre-release version like v1.2.3-beta.1, got $TAG"
            exit 1
          fi
          if [ "$PRERELEASE" != "true" ] && [[ "$VERSION" == *-* ]]; then
            echo "::error::$TAG is a pre-release version; mark the GitHub Release as a pre-release"
            exit 1
          fi
          # Also runs the "version" script, which copies the version into manifest.json and server.json
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Run linting
        run: npm run lint
      - name: Run type check
        run: npm run type-check
      - name: Run tests
        run: npm test
      - name: Build package
        run: npm run build

      - name: Publish to NPM
        run: npm publish --access public --provenance --tag "${{ github.event.release.prerelease && 'beta' || 'latest' }}"

      - name: Pack MCPB bundle
        run: npm run pack:mcpb

      - name: Attach MCPB bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" yazio-mcp.mcpb yazio-mcp.zip --clobber

      - name: Install MCP Publisher
        if: ${{ !github.event.release.prerelease }}
        continue-on-error: true
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Login to MCP Registry
        if: ${{ !github.event.release.prerelease }}
        continue-on-error: true
        run: ./mcp-publisher login github-oidc

      # The registry rejects the publish until npm serves the new version, which takes a short time after npm publish.
      - name: Publish to MCP Registry
        if: ${{ !github.event.release.prerelease }}
        continue-on-error: true
        uses: nick-fields/retry@v4
        with:
          command: ./mcp-publisher publish
          max_attempts: 10
          retry_wait_seconds: 30
          timeout_minutes: 2
