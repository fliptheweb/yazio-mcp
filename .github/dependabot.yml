version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ [nodejs]"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      nodejs:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ [github-actions]"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
